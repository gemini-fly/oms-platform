services:
  postgres:
    image: postgres:16-alpine
    container_name: oms-platform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oms_platform}
      POSTGRES_USER: ${POSTGRES_USER:-oms_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oms_platform}
    ports:
      - "15432:5432"
    volumes:
      - oms_platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  oms_platform_postgres_data:
